<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Total</title>
</head>
<body>
    <script>
        let products = [
            { name: "iphone", price: 125000 },
            { name: "smart tv", price: 135000 },
            { name: "laptop", price: 185000 },
            { name: "watch", price: 55000 },
            { name: "skin care", price: 235000 }
        ];

        for (let meta of products) {
            console.log(meta.name);
        }

        let total = 0;

        for (let product of products) {
            total += product.price;
        }

        console.log("Total price: ₹" + total);
    </script>
</body>
</html>
