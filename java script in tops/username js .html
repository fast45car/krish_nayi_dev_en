<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form action="" onsubmit="return returnvalidation()">
        <div>

            <label for="">username</label>
            <input type="text" placeholder="enter username" id="user">
            <span id="sum"></span>
        </div>
        <div>
            <input type="submit">
        </div>
    </form>

    <script>
        let user = document.getElementById("user")
        let sum = document.getElementById("sum")

        let main = /^[a-zA-Z0-9_]{3,8}$/;
        function returnvalidation() {


            if (!main.test(user)) {
                sum.innerHTML = "the username is not valid"
                sum.style.color = "red"
                return false
            }
            else {
                sum.innerHTML = "the username is valid"
                sum.style.color = "green"
            }
        }
    </script>
</body>

</html>
