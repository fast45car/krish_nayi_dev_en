<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        class matic {
            constructor(a, b) {
                this.a1 = a
                this.b1 = b

            }
            sum() {
                console.log("sum : ", this.a1 + this.b1)
            }

            mul() {
                console.log("sum : ", this.a1 * this.b1)
            }
            sub() {
                console.log("sum : ", this.a1 - this.b1)
            }
            div() {
                console.log("sum : ", this.a1 / this.b1)
            }
        }

        const meta = new matic(505, 30)
       meta.sum()
       meta.mul()
       meta.sub()
       meta.div()
       console.log(meta)
    </script>
</body>

</html>
