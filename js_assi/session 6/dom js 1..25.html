<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <input type="text" id="box">
    <button onclick="song()">add song</button>

    <ul id="output"></ul>
    <script>
        function song() {
         let add = document.querySelector("#box").value;
         let li = document.createElement("li")

         li.textContent = add;

         document.querySelector("#output").appendChild(li)
         document.querySelector("#box").value = "";
        }
    </script>
</body>

</html>
